---
# Driver defaults to podman (native on Fedora 43, rootless).
# CI sets MOLECULE_DRIVER_NAME=docker via workflow env.
driver:
  name: ${MOLECULE_DRIVER_NAME:-podman}
platforms:
  - name: ferro43-test
    image: registry.fedoraproject.org/fedora:43
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
