[defaults]
roles_path = roles
inventory = inventory/hosts.yml
forks = 1
pipelining = true
# Requires managed known_hosts when running against non-loopback targets.
# For localhost-only runs (Molecule, local apply), this has no effect.
host_key_checking = true
retry_files_enabled = false
stdout_callback = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

[privilege_escalation]
become = true
become_method = sudo

[galaxy]
collections_path = collections
