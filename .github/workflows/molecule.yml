---
name: Molecule

on:
  pull_request:
    branches: [main]
    paths:
      - 'ansible/roles/**'
      - 'ansible/requirements.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ansible-core molecule molecule-docker
      - name: Switch Molecule driver to docker for CI
        run: find ansible/roles -path '*/molecule/default/molecule.yml' -exec sed -i 's/name: podman/name: docker/' {} +
      - name: Run Molecule tests
        run: |
          for role in ansible/roles/*/; do
            if [ -d "${role}molecule" ]; then
              echo "=== Testing $(basename "$role") ==="
              (cd "$role" && molecule test)
            fi
          done
